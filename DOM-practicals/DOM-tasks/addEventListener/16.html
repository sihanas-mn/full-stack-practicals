<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <select name="" id="country-selection">
      <option value="">select a country</option>
      <option value="sri-lanka">Sri Lanka</option>
      <option value="autralia">Australia</option>
      <option value="canada">Canada</option>
    </select>

    <p>selected county: <span id="show-country"></span></p>

    <script>
      const elCountrySelection = document.getElementById("country-selection");
      const elShowCountry = document.getElementById("show-country");

      elCountrySelection.addEventListener("change", showSelectedCountry);

      function showSelectedCountry() {
        let selectionIndex = elCountrySelection.value
        elShowCountry.textContent = elCountrySelection.options[elCountrySelection.selectedIndex].text;
        // console.log(elCountrySelection.value);
      }
    </script>
  </body>
</html>
