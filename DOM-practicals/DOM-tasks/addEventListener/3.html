<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">Click to see the alert</button>

    <script>
        const elBtn = document.getElementById("btn")

        elBtn.addEventListener("dblclick", showAlert)

        function showAlert() {
            alert("this alert was triggered by the button")
        }
    </script>
</body>
</html>
