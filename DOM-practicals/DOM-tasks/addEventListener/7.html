<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="https://static.desygner.com/wp-content/uploads/sites/13/2022/05/04141642/Free-Stock-Photos-01.jpg" alt="img here">

    <script>
        const elImg = document.querySelector("img")

        elImg.addEventListener("click", hideImg)

        function hideImg() {
            elImg.style.display = "none"
        }
    </script>
</body>
</html>
