<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
    <p id="para1" >Lorem ipsum dolor sit.</p>

    <script>
        let elPara = document.getElementById("para1")

        elPara.addEventListener("mouseover", changeParaClr)

        function changeParaClr() {
            elPara.classList.toggle("text-amber-400")
        }
    </script>
</body>
