<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="user-button-container"></div>
    <div id="selected-user-detail"></div>

    <script>
      fetch("https://jsonplaceholder.typicode.com/users")
        .then((response) => response.json())
        .then((users) => {
          const container = document.getElementById("user-button-container");
          const userDetails = document.getElementById("selected-user-detail")

          users.forEach((user) => {
            const btn = document.createElement("button"); //creating btn element

            btn.textContent = user.name; // set the button text to the username
            container.appendChild(btn); // put the button inside the HTML container

            btn.addEventListener('click', () => {

                userDetails.innerHTML = ''
                userDetails.innerHTML = `
                    <h1>name: ${user.name}</h1>
                    <p>phone: ${user.phone}</p>
                    <p>address: ${user.address.street}, ${user.address.city}</p>
                `
                // const nameDetail = document.createElement("p")
                // const addressDetail = document.createElement("p")
                // const phoneDetail = document.createElement("p")

                // nameDetail.textContent = user.name
                // phoneDetail.textContent = user.phone
                // addressDetail.textContent = user.address.street

                // userDetails.appendChild(nameDetail)
                // userDetails.appendChild(phoneDetail)
                // userDetails.appendChild(addressDetail)
                // console.log(`Name: ${user.name}`)
                // console.log(`Phone: ${user.phone}`)
                // console.log(`Address: ${user.address}`)
            })
          });
        });
    </script>
  </body>
</html>
