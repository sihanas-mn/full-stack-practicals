<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="noteInp">
    <button id="save-note">Save Note</button>

    <p id="saved-note"></p>

    <script>
        const elInp = document.getElementById("noteInp")
        const elShowNote = document.getElementById("saved-note")
        const elSaveNoteBtn = document.getElementById("save-note")

        elSaveNoteBtn.addEventListener("click", saveNote)

        // let saveNote = () => {
        //     localStorage.setItem("note", elInp.value)
        // }

        function saveNote() {
            elShowNote.innerHTML += `<p>${elInp.value}</p>`
            localStorage.setItem("note", elShowNote.innerHTML)
        }

        if (localStorage) {
            elShowNote.innerHTML = localStorage.getItem("note")
        }

    </script>
</body>
</html>
