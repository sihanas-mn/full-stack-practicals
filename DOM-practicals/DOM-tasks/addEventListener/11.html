<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="inp-field">
    <p>you typed: <span id="output-field"></span></p>

    <script>
        const elInp = document.getElementById("inp-field")
        const elOutput = document.getElementById("output-field")
        
        elInp.addEventListener("keyup", showOutput)

        function showOutput() {
            elOutput.textContent = elInp.value
        }
    </script>
</body>
</html>
