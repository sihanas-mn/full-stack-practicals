<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="POST">
      <label for="title">Title</label>
      <input type="text" name="title" id="title-inp" />
      <label for="body">Body</label>
      <input type="text" name="body" id="body-inp" />
      <label for="user-id">User ID</label>
      <input type="text" name="user-id" id="userID-inp" />

      <button type="submit">POST Data</button>

      <div id="display-field"></div>
    </form>

    <script>
      const form = document.querySelector("form");
      const titleInp = document.getElementById("title-inp");
      const bodyInp = document.getElementById("body-inp");
      const userIDInp = document.getElementById("userID-inp");
      const displayField = document.getElementById("display-field");

      form.addEventListener("submit", (e) => {
        e.preventDefault(); //stop auto reload of the page

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            title: titleInp.value,
            body: bodyInp.value,
            userId: userIDInp.value,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            displayField.innerHTML = `
                <h3>Successfully Posted!</h3>
                <p>ID: ${data.id}</p>
                <p>userID: ${data.userId}</p>
                <p>Title: ${data.title}</p>
                <p>Body: ${data.body}</p>
                `;
          });
      });
    </script>
  </body>
</html>
