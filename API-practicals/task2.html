<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" name="" id="search-name" />
    <button id="search-btn">search</button>

    <script>
      const searchInp = document.getElementById("search-name");
      const searchBtn = document.getElementById("search-btn");

      // 1. Trigger everything from a single event listener callback
      searchBtn.addEventListener("click", async () => {
        const searchName = searchInp.value.trim(); // Grab the fresh input value
        console.log("Searching for:", searchName);

        if (searchName === "") return; // Don't search if the input is empty

        await getUsers(searchName);
      });

      // 2. Accept the search target as an argument
      async function getUsers(targetName) {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users",
        );

        const users = await response.json();

        users.forEach((user) => {
          // 3. Compare the user's actual .name property to the targetName variable
          // Lowercasing both makes the search case-insensitive
          if (user.name.toLowerCase() === targetName.toLowerCase()) {
            console.log("Found Match!", user);
          }
        });
      }
    </script>
  </body>
</html>
