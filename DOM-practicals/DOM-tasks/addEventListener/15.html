<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="inp-field">
    <p id="focus-status"></p>

    <script>
        const elInp = document.getElementById("inp-field")
        const elFocusStatus = document.getElementById("focus-status")

        elInp.addEventListener("blur" ,FocusStatus2)

        function FocusStatus2() {
            elFocusStatus.textContent = "lost focus"
        }


    </script>
</body>
</html>
